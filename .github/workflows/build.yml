                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.UnMock_gps" >

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".LogReceiver"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="io.github.khalil212002.unmockgps.ACTION_LOG_ENTRY" />
                      </intent-filter>
                  </receiver>

                  <meta-data
                      android:name="xposedmodule"
                      android:value="true" />

                  <meta-data
                      android:name="xposeddescription"
                      android:value="LSPatch &amp; LSPosed Module: UnMock GPS and Log Catcher for HungerStation Rider." />

                  <meta-data
                      android:name="xposedminversion"
                      android:value="93" />

                  <meta-data
                      android:name="xposedscope"
                      android:resource="@array/xposedscope" />
              </application>

          </manifest>
          EOF

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses Instantly
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK_DIR/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_DIR/licenses/android-sdk-preview-license"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Signed Release APKs (Fast Non-Blocking)
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hs-assist-lspatch-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: hs-assist-lspatch-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
