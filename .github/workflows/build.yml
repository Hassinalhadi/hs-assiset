      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" /usr/local/lib/android/sdk -name sdkmanager 2>/dev/null | sort -V | tail -n 1)
          echo "Using sdkmanager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Signed Release APK for LSPatch
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hs-assist-lspatch-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: hs-assist-lspatch-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
