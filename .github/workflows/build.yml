name: Inject Features & Build Android APK (LSPatch Ready)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: hs-assist-build-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject LSPatch Support, Crash Fix, Async Log Catcher & UI into Project
        shell: bash
        run: |
          set -e
          rm -f gradle/gradle-daemon-jvm.properties
          cat << 'GPROP' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=true
          kotlin.code.style=official
          android.useAndroidX=true
          GPROP
          sed -i 's/^          //' gradle.properties
          mkdir -p app/src/main/java/io/github/khalil212002/unmockgps
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          # 0. التأكد من نظافة ملف xposed_init لتوافق محمل LSPatch
          printf "io.github.khalil212002.unmockgps.UnMockGPS\n" > app/src/main/assets/xposed_init

          # 1. تحديث app/build.gradle.kts مع compileSdk 36 وتوقيع Release تلقائياً
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              alias(libs.plugins.android.application)
          }

          android {
              namespace = "io.github.khalil212002.unmockgps"
              compileSdk {
                  version = release(36) {
                      minorApiLevel = 1
                  }
              }

              defaultConfig {
                  applicationId = "io.github.khalil212002.unmockgps"
                  minSdk = 28
                  targetSdk = 33
                  versionCode = 4
                  versionName = "1.3-lspatch-stable"

                  testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
              }

              buildTypes {
                  debug {
                      isMinifyEnabled = false
                  }
                  release {
                      signingConfig = signingConfigs.getByName("debug")
                      isMinifyEnabled = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_11
                  targetCompatibility = JavaVersion.VERSION_11
              }

              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
                  disable += setOf("BlockedPrivateApi", "SoonBlockedPrivateApi", "DiscouragedPrivateApi", "PrivateApi")
              }

              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
                  dex {
                      useLegacyPackaging = true
                  }
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
          }

          dependencies {
              implementation(libs.androidx.core.ktx)
              implementation(libs.androidx.appcompat)
              implementation(libs.material)
              testImplementation(libs.junit)
              androidTestImplementation(libs.androidx.junit)
              androidTestImplementation(libs.androidx.espresso.core)
              compileOnly(libs.xposed.api)
          }
          EOF

      - name: Inject UnMockGPS.kt Module Code
        shell: bash
        run: |
          set -e
          # 2. كتابة كود الموديول UnMockGPS.kt (مع اعتراض verifyRootIntegrity ومنع تكرار سجل الكراش)
          cat << 'EOF' > app/src/main/java/io/github/khalil212002/unmockgps/UnMockGPS.kt
          package io.github.khalil212002.unmockgps

          import android.annotation.SuppressLint
          import android.app.AndroidAppHelper
          import android.app.Application
          import android.content.ContentResolver
          import android.content.Context
          import android.content.ContextWrapper
          import android.content.Intent
          import android.content.pm.ApplicationInfo
          import android.content.pm.PackageInfo
          import android.content.pm.PackageManager
          import android.location.Location
          import android.os.BaseBundle
          import android.os.Build
          import android.os.Bundle
          import android.os.Debug
          import android.os.Looper
          import android.os.Process
          import android.widget.TextView
          import android.provider.Settings
          import android.util.Log
          import de.robv.android.xposed.IXposedHookLoadPackage
          import de.robv.android.xposed.IXposedHookZygoteInit
          import de.robv.android.xposed.XC_MethodHook
          import de.robv.android.xposed.XposedBridge
          import de.robv.android.xposed.XposedHelpers
          import de.robv.android.xposed.callbacks.XC_LoadPackage
          import java.io.BufferedReader
          import java.io.File
          import java.io.FileOutputStream
          import java.io.InputStreamReader
          import java.io.OutputStreamWriter
          import java.io.PrintWriter
          import java.io.StringWriter
          import java.net.InetAddress
          import java.net.ServerSocket
          import java.text.SimpleDateFormat
          import java.util.Collections
          import java.util.Date
          import java.util.Locale
          import java.util.WeakHashMap
          import java.util.concurrent.ConcurrentLinkedQueue
          import java.util.concurrent.CopyOnWriteArrayList
          import java.util.concurrent.atomic.AtomicBoolean
          import java.util.concurrent.atomic.AtomicInteger

          class UnMockGPS : IXposedHookLoadPackage, IXposedHookZygoteInit {

              companion object {
                  const val TARGET_PACKAGE = "com.logistics.rider.hungerstation"
                  const val MODULE_PACKAGE = "io.github.khalil212002.unmockgps"
                  const val MODULE_TAG = "HS_UnmockGPS"
                  const val LOG_FILE_NAME = "hs_caught_logs.log"
                  const val ACTION_LOG_ENTRY = "io.github.khalil212002.unmockgps.ACTION_LOG_ENTRY"
                  const val EXTRA_LOG_LINE = "extra_log_line"
                  const val LOCAL_SERVER_PORT = 45821
                  private const val MAX_MEMORY_LOGS = 2000

                  private val BLOCKED_SETTINGS_KEYS = setOf(
                      "mock_location",
                      "allow_mock_location",
                      "development_settings_enabled",
                      "adb_enabled",
                      "usb_mass_storage_enabled"
                  )

                  private val SUSPICIOUS_PACKAGE_KEYWORDS = listOf(
                      "unmockgps",
                      "fakegps",
                      "mock",
                      "spoof",
                      "gpsjoystick",
                      "lexa.fakegps",
                      "incorporateapps",
                      "lsposed",
                      "lspatch",
                      "edxposed",
                      "xposed",
                      "magisk",
                      "kernelsu",
                      "apatch"
                  )
              }

              private val isCapturing = ThreadLocal.withInitial { false }
              private val memoryLogs = CopyOnWriteArrayList<String>()
              private val asyncLogQueue = ConcurrentLinkedQueue<String>()
              private val loggedCrashThrowables = Collections.synchronizedSet(Collections.newSetFromMap(WeakHashMap<Throwable, Boolean>()))
              private val serverStarted = AtomicBoolean(false)
              private val workerStarted = AtomicBoolean(false)
              private val hooksInstalled = AtomicBoolean(false)
              private val previousLogsLoaded = AtomicBoolean(false)
              private val firebaseWarnCounter = AtomicInteger(0)
              @Volatile
              private var appContext: Context? = null

              override fun initZygote(startupParam: IXposedHookZygoteInit.StartupParam?) {
              }

              override fun handleLoadPackage(lpparam: XC_LoadPackage.LoadPackageParam) {
                  if (lpparam.packageName == MODULE_PACKAGE) return
                  if (lpparam.packageName != TARGET_PACKAGE && !lpparam.packageName.contains("hungerstation", ignoreCase = true)) {
                      return
                  }

                  if (!hooksInstalled.compareAndSet(false, true)) return

                  // 1. تحميل سجلات الجلسة السابقة
                  loadPreviousSessionLogs()

                  // 2. تشغيل خيط الكتابة الخلفي لمنع تجميد الواجهة
                  startAsyncLogWorker()

                  // 3. تشغيل الخادم المحلي لنقل السجلات لواجهة التطبيق
                  startLocalLogServer()

                  // 4. التقاط Context التطبيق وتنظيف قاعدة بيانات incognia_errors
                  hookApplicationContext(lpparam)

                  captureLog("INFO", MODULE_TAG, "=== بدء جلسة جديدة داخل: ${lpparam.packageName} (PID=${Process.myPid()}) ===")

                  // 5. تفعيل صائد السجلات والكراشات
                  setupLogAndCrashCatcher()

                  // 6. تفعيل خطافات الموقع الشاملة (Location + Settings + Bundle + PackageManager)
                  setupLocationHooks(lpparam)

                  // 7. تفعيل خطاف تجاوز فحص verifyRootIntegrity و Incognia
                  setupIntegrityHooks(lpparam)
              }

              private fun formatNow(): String {
                  return SimpleDateFormat("yyyy-MM-dd HH:mm:ss.SSS", Locale.US).format(Date())
              }

              private fun getPrimaryInternalLogFile(): File {
                  val ctx = resolveContext()
                  if (ctx != null) {
                      return File(ctx.filesDir, LOG_FILE_NAME)
                  }
                  return File("/data/user/0/$TARGET_PACKAGE/files/$LOG_FILE_NAME")
              }

              private fun loadPreviousSessionLogs() {
                  if (!previousLogsLoaded.compareAndSet(false, true)) return
                  try {
                      val file = getPrimaryInternalLogFile()
                      if (file.exists() && file.canRead() && file.length() > 0) {
                          val lines = file.readLines()
                          val tail = if (lines.size > 600) lines.takeLast(600) else lines
                          memoryLogs.addAll(tail)
                      }
                  } catch (_: Throwable) {
                  }
              }

              private fun hookApplicationContext(lpparam: XC_LoadPackage.LoadPackageParam) {
                  runCatching {
                      XposedHelpers.findAndHookMethod(
                          ContextWrapper::class.java,
                          "attachBaseContext",
                          Context::class.java,
                          object : XC_MethodHook() {
                              override fun afterHookedMethod(param: MethodHookParam) {
                                  try {
                                      val ctx = param.args[0] as? Context ?: return
                                      if (appContext == null) {
                                          appContext = ctx.applicationContext ?: ctx
                                          loadPreviousSessionLogs()
                                          sanitizeIncogniaDatabase(appContext!!)
                                          setupIntegrityHooks(lpparam)
                                      }
                                  } catch (_: Throwable) {
                                  }
                              }
                          }
                      )
                  }

                  runCatching {
                      XposedHelpers.findAndHookMethod(
                          Application::class.java,
                          "onCreate",
                          object : XC_MethodHook() {
                              override fun afterHookedMethod(param: MethodHookParam) {
                                  try {
                                      val app = param.thisObject as? Application ?: return
                                      appContext = app.applicationContext ?: app
                                      loadPreviousSessionLogs()
                                      sanitizeIncogniaDatabase(appContext!!)
                                      setupIntegrityHooks(lpparam)
                                      if (!okhttpHooked.get() && !okhttpClientHooked.get()) {
                                          captureLog("HOOK", MODULE_TAG, "ℹ️ لم يتم العثور على okhttp3 بالاسم الصريح (غالباً مشفرة بـ R8)")
                                      }
                                  } catch (_: Throwable) {
                                  }
                              }
                          }
                      )
                  }
              }

              private val integrityHooked = AtomicBoolean(false)
              private val coroutineIntegrityHooked = AtomicBoolean(false)
              private val rootFilesHooked = AtomicBoolean(false)
              private val antiDebugHooked = AtomicBoolean(false)
              private val textViewHooked = AtomicBoolean(false)
              private val okhttpHooked = AtomicBoolean(false)
              private val okhttpClientHooked = AtomicBoolean(false)
              private val httpUrlConnHooked = AtomicBoolean(false)
              private val cronetHooked = AtomicBoolean(false)
              private val hookedRuntimeCallClasses = Collections.synchronizedSet(HashSet<Class<*>>())
              private val ial403Logged = AtomicBoolean(false)
              private fun setupIntegrityHooks(lpparam: XC_LoadPackage.LoadPackageParam) {
                  val classLoader = resolveContext()?.classLoader ?: lpparam.classLoader ?: return

                  // 0. إخفاء ملفات الروت و Build.TAGS حتى ينجح فحص verifyRootIntegrity طبيعياً دون تعطيل تسجيل الدخول
                  if (rootFilesHooked.compareAndSet(false, true)) {
                      runCatching {
                          val buildClass = android.os.Build::class.java
                          val tagsField = buildClass.getDeclaredField("TAGS")
                          tagsField.isAccessible = true
                          val currentTags = tagsField.get(null) as? String
                          if (currentTags != null && currentTags.contains("test-keys")) {
                              tagsField.set(null, "release-keys")
                          }
                      }
                      runCatching {
                          val rootIndicators = listOf(
                              "/su", "/magisk", "/busybox", "superuser.apk",
                              "xposed", "lsposed", "lspatch", "edxposed", "kernelsu", "apatch"
                          )
                          XposedHelpers.findAndHookMethod(File::class.java, "exists", object : XC_MethodHook() {
                              override fun beforeHookedMethod(param: MethodHookParam) {
                                  val f = param.thisObject as? File ?: return
                                  val p = f.path.lowercase(Locale.ROOT)
                                  if (p == "/system/bin/su" || p == "/system/xbin/su" || p == "/sbin/su" ||
                                      p == "/data/local/xbin/su" || p == "/data/local/bin/su" || p == "/data/local/su" ||
                                      p == "/su/bin/su" || rootIndicators.any { p.endsWith(it) || p.contains("/magisk") }
                                  ) {
                                      param.result = false
                                  }
                              }
                          })
                      }
                  }

                  // 1. اعتراض دالة verifyRootIntegrity المباشرة في RiderSupportFeaturesImpl
                  runCatching {
                      val implCls = XposedHelpers.findClassIfExists(
                          "com.roadrunner.rider.support.implementation.RiderSupportFeaturesImpl",
                          classLoader
                      )
                      if (implCls != null && integrityHooked.compareAndSet(false, true)) {
                          XposedBridge.hookAllMethods(implCls, "verifyRootIntegrity", object : XC_MethodHook() {
                              override fun beforeHookedMethod(param: MethodHookParam) {
                                  val method = param.method as? java.lang.reflect.Method
                                  val returnType = method?.returnType
                                  param.result = when (returnType) {
                                      Boolean::class.javaPrimitiveType, java.lang.Boolean::class.java -> true
                                      Void.TYPE -> null
                                      else -> kotlin.Unit
                                  }
                                  captureLog("HOOK", MODULE_TAG, "🛡️ تم تجاوز RiderSupportFeaturesImpl.verifyRootIntegrity بأمان")
                              }
                          })
                      }
                  }

                  // 2. اعتراض الكوروتين verifyRootIntegrity$1.invokeSuspend في afterHookedMethod فقط عند حدوث استثناء
                  // (مهم جداً: عدم استخدام beforeHookedMethod هنا لأن إرجاع kotlin.Unit عند label=0 يعطل الكوروتين ويمنع تسجيل الدخول)
                  runCatching {
                      val coroutineCls = XposedHelpers.findClassIfExists(
                          "com.roadrunner.rider.support.implementation.RiderSupportFeaturesImpl\$verifyRootIntegrity\$1",
                          classLoader
                      )
                      if (coroutineCls != null && coroutineIntegrityHooked.compareAndSet(false, true)) {
                          XposedBridge.hookAllMethods(coroutineCls, "invokeSuspend", object : XC_MethodHook() {
                              override fun afterHookedMethod(param: MethodHookParam) {
                                  if (param.throwable != null) {
                                      captureLog("HOOK", MODULE_TAG, "🛡️ تم إخماد استثناء داخل verifyRootIntegrity\$1: ${param.throwable.message}")
                                      param.throwable = null
                                      param.result = kotlin.Unit
                                  }
                              }
                          })
                      }
                  }

                  // 3. إخفاء علامات التصحيح وخصائص النظام و Xposed لتفادي رفض IAL403
                  if (antiDebugHooked.compareAndSet(false, true)) {
                      runCatching {
                          XposedHelpers.findAndHookMethod(Debug::class.java, "isDebuggerConnected", object : XC_MethodHook() {
                              override fun beforeHookedMethod(param: MethodHookParam) {
                                  param.result = false
                              }
                          })
                          XposedHelpers.findAndHookMethod(Debug::class.java, "waitingForDebugger", object : XC_MethodHook() {
                              override fun beforeHookedMethod(param: MethodHookParam) {
                                  param.result = false
                              }
                          })
                      }
                      runCatching {
                          val sysProps = XposedHelpers.findClassIfExists("android.os.SystemProperties", classLoader)
                          if (sysProps != null) {
                              XposedBridge.hookAllMethods(sysProps, "get", object : XC_MethodHook() {
                                  override fun beforeHookedMethod(param: MethodHookParam) {
                                      val key = param.args.firstOrNull() as? String ?: return
                                      when (key) {
                                          "ro.debuggable" -> param.result = "0"
                                          "ro.secure" -> param.result = "1"
                                          "ro.build.tags" -> param.result = "release-keys"
                                          "ro.build.type" -> param.result = "user"
                                          "service.adb.root" -> param.result = "0"
                                          "ro.boot.verifiedbootstate" -> param.result = "green"
                                          "ro.boot.flash.locked" -> param.result = "1"
                                      }
                                  }
                              })
                          }
                      }
                  }

                  // 4. مراقب تشخيصي لرسائل IAL403 واستجابات الشبكة (OkHttp3 + HttpURLConnection + Cronet)
                  if (textViewHooked.compareAndSet(false, true)) {
                      runCatching {
                          XposedHelpers.findAndHookMethod(
                              TextView::class.java,
                              "setText",
                              CharSequence::class.java,
                              TextView.BufferType::class.java,
                              object : XC_MethodHook() {
                                  override fun beforeHookedMethod(param: MethodHookParam) {
                                      val cs = param.args[0] as? CharSequence ?: return
                                      if (cs.contains("IAL403", ignoreCase = true) && ial403Logged.compareAndSet(false, true)) {
                                          captureLog(
                                              "HOOK",
                                              MODULE_TAG,
                                              "🚨 تم رصد ظهور IAL403 في الواجهة: $cs",
                                              Throwable("IAL403_UI_TRACE"),
                                              syncDiskImmediately = true
                                          )
                                      }
                                  }
                              }
                          )
                      }
                  }

                  // 4.1 خطاف OkHttp3 (RealCall + OkHttpClient.newCall لاكتشاف الكلاسات المشفرة بـ R8)
                  setupOkHttpHooks(classLoader)

                  // 4.2 خطاف HttpURLConnection الاحتياطي
                  setupHttpUrlConnectionHooks(classLoader)

                  // 4.3 خطاف Cronet الاحتياطي
                  setupCronetHooks(classLoader)

                  // 4.4 خطافات كشف OkHttp المشفر (FirebasePerfOkHttpClient) + WebView + DNS
                  setupDeepNetworkDiscoveryHooks(classLoader)

                  // 4.5 تشخيص Play Integrity ومسار الحزمة الفعلي
                  setupPlayIntegrityDiagnostics(classLoader)
              }

              private fun shouldLogNetworkUrl(url: String, code: Int): Boolean {
                  if (code >= 400 || code < 0) return true
                  val lower = url.lowercase(Locale.ROOT)
                  if (lower.contains(".png") || lower.contains(".jpg") || lower.contains(".jpeg") ||
                      lower.contains(".webp") || lower.contains(".svg") || lower.contains(".css") ||
                      lower.contains(".js") || lower.contains("google-analytics") ||
                      lower.contains("app-measurement") || lower.contains("crashlytics") ||
                      lower.contains("braze") || lower.contains("mapbox") ||
                      lower.contains("appsflyer") || lower.contains("adjust.com") ||
                      lower.contains("doubleclick") || lower.contains("facebook.com")
                  ) {
                      return false
                  }
                  return lower.contains("hungerstation") || lower.contains("deliveryhero") ||
                      lower.contains("roadrunner") || lower.contains("login") ||
                      lower.contains("auth") || lower.contains("token") ||
                      lower.contains("otp") || lower.contains("session") ||
                      lower.contains("integrity") || lower.contains("verify") ||
                      lower.contains("incognia") || lower.contains("rider")
              }

              private fun logOkHttpResponseOrError(param: XC_MethodHook.MethodHookParam, sourceName: String) {
                  try {
                      if (param.throwable != null) {
                          val callObj = param.thisObject
                          val req = runCatching { XposedHelpers.callMethod(callObj, "request") }.getOrNull()
                          val url = runCatching { XposedHelpers.callMethod(req, "url")?.toString() }.getOrNull() ?: "unknown"
                          captureLog(
                              "ERROR",
                              MODULE_TAG,
                              "🌐 [$sourceName] Exception -> $url | ${param.throwable.javaClass.simpleName}: ${param.throwable.message}",
                              param.throwable,
                              syncDiskImmediately = true
                          )
                          return
                      }
                      val resp = param.result ?: return
                      val code = runCatching { XposedHelpers.callMethod(resp, "code") as? Int }.getOrNull() ?: return
                      val req = runCatching { XposedHelpers.callMethod(resp, "request") }.getOrNull() ?: return
                      val url = runCatching { XposedHelpers.callMethod(req, "url")?.toString() }.getOrNull() ?: ""
                      if (shouldLogNetworkUrl(url, code)) {
                          val bodyPreview = runCatching {
                              val peek = XposedHelpers.callMethod(resp, "peekBody", 2048L)
                              XposedHelpers.callMethod(peek, "string") as? String
                          }.getOrNull() ?: ""
                          val level = if (code >= 400) "ERROR" else "INFO"
                          captureLog(
                              level,
                              MODULE_TAG,
                              "🌐 [$sourceName] HTTP $code -> $url | body=$bodyPreview",
                              null,
                              syncDiskImmediately = (code >= 400)
                          )
                      }
                  } catch (_: Throwable) {
                  }
              }

              private fun hookOkHttpCallClass(callCls: Class<*>, label: String): Boolean {
                  if (!hookedRuntimeCallClasses.add(callCls)) return true
                  var hookedCount = 0
                  val hookCb = object : XC_MethodHook() {
                      override fun afterHookedMethod(param: MethodHookParam) {
                          logOkHttpResponseOrError(param, label)
                      }
                  }
                  for (methodName in listOf("getResponseWithInterceptorChain\$okhttp", "getResponseWithInterceptorChain", "execute")) {
                      runCatching {
                          val unhooks = XposedBridge.hookAllMethods(callCls, methodName, hookCb)
                          if (unhooks.isNotEmpty()) hookedCount += unhooks.size
                      }
                  }
                  if (hookedCount > 0) {
                      captureLog("HOOK", MODULE_TAG, "✅ تم تفعيل خطاف OkHttp على ${callCls.name} ($hookedCount دوال)")
                      return true
                  }
                  return false
              }

              private fun setupOkHttpHooks(classLoader: ClassLoader) {
                  if (!okhttpHooked.get()) {
                      runCatching {
                          val realCallCls = XposedHelpers.findClassIfExists("okhttp3.internal.connection.RealCall", classLoader)
                              ?: XposedHelpers.findClassIfExists("okhttp3.RealCall", classLoader)
                          if (realCallCls != null && hookOkHttpCallClass(realCallCls, "OkHttp")) {
                              okhttpHooked.set(true)
                          }
                      }
                  }
                  if (!okhttpClientHooked.get()) {
                      runCatching {
                          val clientCls = XposedHelpers.findClassIfExists("okhttp3.OkHttpClient", classLoader)
                          if (clientCls != null) {
                              val unhooks = XposedBridge.hookAllMethods(clientCls, "newCall", object : XC_MethodHook() {
                                  override fun afterHookedMethod(param: MethodHookParam) {
                                      val callObj = param.result ?: return
                                      hookOkHttpCallClass(callObj.javaClass, "OkHttp-Runtime")
                                  }
                              })
                              if (unhooks.isNotEmpty()) {
                                  okhttpClientHooked.set(true)
                                  captureLog("HOOK", MODULE_TAG, "✅ تم تفعيل خطاف OkHttpClient.newCall بنجاح")
                              }
                          }
                      }
                  }
              }

              private fun setupHttpUrlConnectionHooks(classLoader: ClassLoader) {
                  if (httpUrlConnHooked.get()) return
                  val candidates = listOf(
                      "com.android.okhttp.internal.huc.HttpURLConnectionImpl",
                      "com.android.okhttp.internal.huc.DelegatingHttpsURLConnection",
                      "java.net.HttpURLConnection"
                  )
                  var anyHooked = false
                  for (clsName in candidates) {
                      runCatching {
                          val cls = XposedHelpers.findClassIfExists(clsName, classLoader) ?: return@runCatching
                          val unhooks = XposedBridge.hookAllMethods(cls, "getResponseCode", object : XC_MethodHook() {
                              override fun afterHookedMethod(param: MethodHookParam) {
                                  if (isCapturing.get() == true) return
                                  val conn = param.thisObject as? java.net.HttpURLConnection ?: return
                                  val url = conn.url?.toString() ?: ""
                                  if (param.throwable != null) {
                                      captureLog(
                                          "ERROR",
                                          MODULE_TAG,
                                          "🌐 [HttpURLConnection] Exception -> $url | ${param.throwable.message}",
                                          param.throwable,
                                          syncDiskImmediately = true
                                      )
                                      return
                                  }
                                  val code = param.result as? Int ?: return
                                  if (shouldLogNetworkUrl(url, code)) {
                                      captureLog(
                                          if (code >= 400) "ERROR" else "INFO",
                                          MODULE_TAG,
                                          "🌐 [HttpURLConnection] HTTP $code -> $url",
                                          null,
                                          syncDiskImmediately = (code >= 400)
                                      )
                                  }
                              }
                          })
                          if (unhooks.isNotEmpty()) anyHooked = true
                      }
                  }
                  if (anyHooked) {
                      httpUrlConnHooked.set(true)
                  }
              }

              private val hookedCronetCallbacks = Collections.synchronizedSet(HashSet<Class<*>>())
              private val jsonHooked = AtomicBoolean(false)

              private fun hookCronetCallbackClass(cbCls: Class<*>) {
                  if (!hookedCronetCallbacks.add(cbCls)) return
                  runCatching {
                      XposedBridge.hookAllMethods(cbCls, "onResponseStarted", object : XC_MethodHook() {
                          override fun beforeHookedMethod(param: MethodHookParam) {
                              val info = param.args.getOrNull(1) ?: return
                              val code = runCatching { XposedHelpers.callMethod(info, "getHttpStatusCode") as? Int }.getOrNull() ?: return
                              val url = runCatching { XposedHelpers.callMethod(info, "getUrl") as? String }.getOrNull() ?: ""
                              if (shouldLogNetworkUrl(url, code)) {
                                  captureLog(
                                      if (code >= 400) "ERROR" else "INFO",
                                      MODULE_TAG,
                                      "🌐 [Cronet] HTTP $code -> $url",
                                      null,
                                      syncDiskImmediately = (code >= 400)
                                  )
                              }
                          }
                      })
                      XposedBridge.hookAllMethods(cbCls, "onFailed", object : XC_MethodHook() {
                          override fun beforeHookedMethod(param: MethodHookParam) {
                              val info = param.args.getOrNull(1)
                              val err = param.args.getOrNull(2) as? Throwable
                              val url = runCatching { XposedHelpers.callMethod(info, "getUrl") as? String }.getOrNull() ?: "unknown"
                              captureLog(
                                  "ERROR",
                                  MODULE_TAG,
                                  "🌐 [Cronet] Failed -> $url | ${err?.message}",
                                  err,
                                  syncDiskImmediately = true
                              )
                          }
                      })
                  }
              }

              private val hookedCronetEngineClasses = Collections.synchronizedSet(HashSet<Class<*>>())

              private fun hookConcreteCronetEngine(engineCls: Class<*>) {
                  if (!hookedCronetEngineClasses.add(engineCls)) return
                  var count = 0
                  for (mName in listOf("newUrlRequestBuilder", "createUrlRequestBuilder")) {
                      runCatching {
                          val unhooks = XposedBridge.hookAllMethods(engineCls, mName, object : XC_MethodHook() {
                              override fun beforeHookedMethod(param: MethodHookParam) {
                                  val cb = param.args.getOrNull(1) ?: return
                                  hookCronetCallbackClass(cb.javaClass)
                              }
                          })
                          if (unhooks.isNotEmpty()) count += unhooks.size
                      }
                  }
                  if (count > 0) {
                      captureLog("HOOK", MODULE_TAG, "✅ تم تفعيل خطاف Cronet على ${engineCls.name} ($count دوال)")
                  }
              }

              private fun setupCronetHooks(classLoader: ClassLoader) {
                  if (!cronetHooked.get()) {
                      var anyHooked = false
                      for (builderName in listOf(
                          "org.chromium.net.CronetEngine\$Builder",
                          "org.chromium.net.ExperimentalCronetEngine\$Builder",
                          "org.chromium.net.ICronetEngineBuilder"
                      )) {
                          runCatching {
                              val builderCls = XposedHelpers.findClassIfExists(builderName, classLoader) ?: return@runCatching
                              val unhooks = XposedBridge.hookAllMethods(builderCls, "build", object : XC_MethodHook() {
                                  override fun afterHookedMethod(param: MethodHookParam) {
                                      val engine = param.result ?: return
                                      hookConcreteCronetEngine(engine.javaClass)
                                      engine.javaClass.superclass?.let { sup ->
                                          if (sup != Any::class.java) hookConcreteCronetEngine(sup)
                                      }
                                  }
                              })
                              if (unhooks.isNotEmpty()) anyHooked = true
                          }
                      }
                      if (anyHooked) {
                          cronetHooked.set(true)
                          captureLog("HOOK", MODULE_TAG, "✅ تم تفعيل مراقب CronetEngine.Builder.build()")
                      }
                  }

                  if (jsonHooked.compareAndSet(false, true)) {
                      runCatching {
                          XposedHelpers.findAndHookConstructor(
                              org.json.JSONObject::class.java,
                              String::class.java,
                              object : XC_MethodHook() {
                                  override fun afterHookedMethod(param: MethodHookParam) {
                                      if (isCapturing.get() == true) return
                                      val raw = param.args.firstOrNull() as? String ?: return
                                      if (raw.length in 10..3000 &&
                                          (raw.contains("IAL403", true) || raw.contains("403") || raw.contains("integrity", true) || raw.contains("unauthorized", true)) &&
                                          !raw.contains("braze", true) && !raw.contains("mapbox", true) && !raw.contains("gtm", true)
                                      ) {
                                          captureLog(
                                              "HOOK",
                                              MODULE_TAG,
                                              "📦 [JSON] $raw",
                                              null,
                                              syncDiskImmediately = raw.contains("IAL403", true)
                                          )
                                      }
                                  }
                              }
                          )
                      }
                  }
              }

              private val deepDiscoveryHooked = AtomicBoolean(false)
              private val webViewHooked = AtomicBoolean(false)
              private val dnsHooked = AtomicBoolean(false)
              private val seenDnsHosts = Collections.synchronizedSet(HashSet<String>())
              private val hookedWebClients = Collections.synchronizedSet(HashSet<Class<*>>())

              private fun setupDeepNetworkDiscoveryHooks(classLoader: ClassLoader) {
                  // 1. FirebasePerfOkHttpClient (يمسك كائن Call حتى لو تم تشفير حزمة okhttp3 بـ R8)
                  if (deepDiscoveryHooked.compareAndSet(false, true)) {
                      runCatching {
                          val fpOkHttp = XposedHelpers.findClassIfExists("com.google.firebase.perf.network.FirebasePerfOkHttpClient", classLoader)
                          if (fpOkHttp != null) {
                              XposedBridge.hookAllMethods(fpOkHttp, "execute", object : XC_MethodHook() {
                                  override fun afterHookedMethod(param: MethodHookParam) {
                                      val callObj = param.args.firstOrNull()
                                      val resp = param.result
                                      val err = param.throwable
                                      val info = resp?.toString() ?: callObj?.toString() ?: ""
                                      if (err != null) {
                                          captureLog("ERROR", MODULE_TAG, "🌐 [FP-OkHttp] Exception: ${err.message} | $info", err, syncDiskImmediately = true)
                                      } else if (info.contains("code=4") || info.contains("code=5") || info.contains("login", true) || info.contains("auth", true)) {
                                          captureLog("INFO", MODULE_TAG, "🌐 [FP-OkHttp] $info", null)
                                      }
                                  }
                              })
                              val hookedFpCallbacks = Collections.synchronizedSet(HashSet<Class<*>>())
                              fun extractUrlHint(obj: Any?): String {
                                  if (obj == null) return ""
                                  val s = runCatching { obj.toString() }.getOrNull() ?: ""
                                  if (s.contains("http", true)) return s
                                  return runCatching {
                                      for (f in obj.javaClass.declaredFields) {
                                          f.isAccessible = true
                                          val v = f.get(obj) ?: continue
                                          val vs = v.toString()
                                          if (vs.contains("http", true)) return@runCatching vs
                                      }
                                      ""
                                  }.getOrNull() ?: ""
                              }
                              fun extractStatusCode(resp: Any?): Int? {
                                  if (resp == null) return null
                                  return runCatching {
                                      for (f in resp.javaClass.declaredFields) {
                                          if (f.type == Int::class.javaPrimitiveType) {
                                              f.isAccessible = true
                                              val code = f.getInt(resp)
                                              if (code in 100..599) return@runCatching code
                                          }
                                      }
                                      null
                                  }.getOrNull()
                              }
                              XposedBridge.hookAllMethods(fpOkHttp, "enqueue", object : XC_MethodHook() {
                                  override fun beforeHookedMethod(param: MethodHookParam) {
                                      val callObj = param.args.getOrNull(0)
                                      val urlHint = extractUrlHint(callObj)
                                      if (urlHint.isNotEmpty() && shouldLogNetworkUrl(urlHint, 200)) {
                                          captureLog("INFO", MODULE_TAG, "🌐 [FP-OkHttp.req] $urlHint", null)
                                      }
                                      val cbObj = param.args.getOrNull(1) ?: return
                                      val cbCls = cbObj.javaClass
                                      if (!hookedFpCallbacks.add(cbCls)) return
                                      for (m in cbCls.declaredMethods) {
                                          if (m.parameterCount == 2) {
                                              val p1 = m.parameterTypes[1]
                                              if (Throwable::class.java.isAssignableFrom(p1)) {
                                                  runCatching {
                                                      XposedBridge.hookMethod(m, object : XC_MethodHook() {
                                                          override fun beforeHookedMethod(p: MethodHookParam) {
                                                              val c = p.args.getOrNull(0)
                                                              val err = p.args.getOrNull(1) as? Throwable
                                                              val reqHint = extractUrlHint(c)
                                                              captureLog("ERROR", MODULE_TAG, "🌐 [FP-OkHttp.fail] $reqHint | ${err?.javaClass?.simpleName}: ${err?.message}", err, syncDiskImmediately = true)
                                                          }
                                                      })
                                                  }
                                              } else if (!p1.isPrimitive) {
                                                  runCatching {
                                                      XposedBridge.hookMethod(m, object : XC_MethodHook() {
                                                          override fun beforeHookedMethod(p: MethodHookParam) {
                                                              val c = p.args.getOrNull(0)
                                                              val resp = p.args.getOrNull(1) ?: return
                                                              val code = extractStatusCode(resp) ?: -1
                                                              val respStr = extractUrlHint(resp).ifEmpty { extractUrlHint(c) }
                                                              if (code >= 400 || shouldLogNetworkUrl(respStr, code)) {
                                                                  var errDetails = ""
                                                                  if (code >= 400) {
                                                                      errDetails = runCatching {
                                                                          val sb = StringBuilder()
                                                                          // 1. استخراج الترويسات (Headers) من كائن Response
                                                                          for (f in resp.javaClass.declaredFields) {
                                                                              f.isAccessible = true
                                                                              val v = f.get(resp) ?: continue
                                                                              val vs = v.toString()
                                                                              if (vs.contains(":") && vs.contains("\n") && vs.length < 1500) {
                                                                                  sb.append(" | headers=").append(vs.replace("\n", "; "))
                                                                                  break
                                                                              }
                                                                          }
                                                                          // 2. استخراج نص الرد (Body) عبر peekBody مع تجنب toString
                                                                          val peekMethod = resp.javaClass.declaredMethods.firstOrNull {
                                                                              it.parameterCount == 1 && it.parameterTypes[0] == Long::class.javaPrimitiveType && !it.returnType.isPrimitive
                                                                          }
                                                                          peekMethod?.isAccessible = true
                                                                          val bodyObj = peekMethod?.invoke(resp, 4096L)
                                                                          if (bodyObj != null) {
                                                                              var foundBody = ""
                                                                              for (m in bodyObj.javaClass.methods) {
                                                                                  if (m.parameterCount == 0 && m.returnType == String::class.java && m.name != "toString") {
                                                                                      val candidate = runCatching {
                                                                                          m.isAccessible = true
                                                                                          m.invoke(bodyObj) as? String
                                                                                      }.getOrNull() ?: continue
                                                                                      if (candidate.isNotBlank() && (candidate.startsWith("{") || candidate.startsWith("[") || candidate.length > foundBody.length)) {
                                                                                          foundBody = candidate
                                                                                      }
                                                                                  }
                                                                              }
                                                                              if (foundBody.isNotEmpty()) {
                                                                                  sb.append(" | body=").append(foundBody.take(1500))
                                                                              }
                                                                          }
                                                                          sb.toString()
                                                                      }.getOrNull() ?: ""
                                                                  }
                                                                  captureLog(
                                                                      if (code >= 400) "ERROR" else "INFO",
                                                                      MODULE_TAG,
                                                                      "🌐 [FP-OkHttp.resp] code=$code | $respStr$errDetails",
                                                                      null,
                                                                      syncDiskImmediately = (code >= 400)
                                                                  )
                                                              }
                                                          }
                                                      })
                                                  }
                                              }
                                          }
                                      }
                                  }
                              })
                              captureLog("HOOK", MODULE_TAG, "✅ تم تفعيل خطاف FirebasePerfOkHttpClient")
                          }
                      }
                  }

                  // 2. مراقبة WebView و WebViewClient (إذا كان تسجيل الدخول عبر صفحة ويب)
                  if (webViewHooked.compareAndSet(false, true)) {
                      runCatching {
                          val wvCls = android.webkit.WebView::class.java
                          XposedHelpers.findAndHookMethod(wvCls, "loadUrl", String::class.java, object : XC_MethodHook() {
                              override fun beforeHookedMethod(param: MethodHookParam) {
                                  val url = param.args[0] as? String ?: return
                                  if (!url.startsWith("javascript:", true)) {
                                      captureLog("INFO", MODULE_TAG, "🌐 [WebView.loadUrl] $url", null)
                                  }
                              }
                          })
                          XposedHelpers.findAndHookMethod(wvCls, "setWebViewClient", android.webkit.WebViewClient::class.java, object : XC_MethodHook() {
                              override fun beforeHookedMethod(param: MethodHookParam) {
                                  val client = param.args[0] ?: return
                                  val cls = client.javaClass
                                  if (!hookedWebClients.add(cls)) return
                                  runCatching {
                                      XposedBridge.hookAllMethods(cls, "onReceivedHttpError", object : XC_MethodHook() {
                                          override fun beforeHookedMethod(p: MethodHookParam) {
                                              val req = p.args.getOrNull(1) as? android.webkit.WebResourceRequest
                                              val resp = p.args.getOrNull(2) as? android.webkit.WebResourceResponse
                                              val url = req?.url?.toString() ?: "unknown"
                                              val code = resp?.statusCode ?: 0
                                              captureLog("ERROR", MODULE_TAG, "🌐 [WebView HTTP $code] $url", null, syncDiskImmediately = (code == 403))
                                          }
                                      })
                                  }
                              }
                          })
                      }
                  }

                  // 3. مراقبة استعلامات DNS لمعرفة النطاقات التي يتصل بها التطبيق
                  if (dnsHooked.compareAndSet(false, true)) {
                      runCatching {
                          XposedHelpers.findAndHookMethod(InetAddress::class.java, "getAllByName", String::class.java, object : XC_MethodHook() {
                              override fun beforeHookedMethod(param: MethodHookParam) {
                                  if (isCapturing.get() == true) return
                                  val host = param.args[0] as? String ?: return
                                  val lower = host.lowercase(Locale.ROOT)
                                  if (lower == "127.0.0.1" || lower == "localhost" ||
                                      lower.contains("braze") || lower.contains("mapbox") ||
                                      lower.contains("crashlytics") || lower.contains("app-measurement") ||
                                      lower.contains("doubleclick") || lower.contains("facebook") ||
                                      lower.contains("appsflyer") || lower.contains("adjust")
                                  ) return
                                  if (seenDnsHosts.add(lower)) {
                                      captureLog("INFO", MODULE_TAG, "🌐 [DNS] $host", null)
                                  }
                              }
                          })
                      }
                  }
              }

              private val playIntegrityDiagHooked = AtomicBoolean(false)
              private val apkPathDiagLogged = AtomicBoolean(false)

              private fun setupPlayIntegrityDiagnostics(classLoader: ClassLoader) {
                  if (apkPathDiagLogged.get() == false) {
                      runCatching {
                          val ctx = resolveContext()
                          if (ctx != null && apkPathDiagLogged.compareAndSet(false, true)) {
                              val splits = ctx.applicationInfo?.splitSourceDirs?.joinToString(", ") ?: "none"
                              captureLog("HOOK", MODULE_TAG, "🔍 [Diag] apk=${ctx.packageCodePath} | splits=$splits", null)
                          }
                      }
                  }
                  if (!playIntegrityDiagHooked.compareAndSet(false, true)) return
                  for (clsName in listOf(
                      "com.google.android.play.core.integrity.IntegrityManager",
                      "com.google.android.play.core.integrity.StandardIntegrityManager",
                      "com.google.android.play.core.integrity.IntegrityManagerFactory"
                  )) {
                      runCatching {
                          val cls = XposedHelpers.findClassIfExists(clsName, classLoader) ?: return@runCatching
                          captureLog("HOOK", MODULE_TAG, "🔍 [Diag] تم رصد فئة Play Integrity: $clsName", null)
                      }
                  }
                  // مراقبة إنشاء IntegrityTokenRequest أو استدعاء IntegrityServiceException
                  runCatching {
                      val exCls = XposedHelpers.findClassIfExists("com.google.android.play.core.integrity.IntegrityServiceException", classLoader)
                          ?: XposedHelpers.findClassIfExists("com.google.android.play.core.integrity.StandardIntegrityException", classLoader)
                      if (exCls != null) {
                          XposedBridge.hookAllConstructors(exCls, object : XC_MethodHook() {
                              override fun afterHookedMethod(param: MethodHookParam) {
                                  val err = param.thisObject as? Throwable
                                  captureLog("ERROR", MODULE_TAG, "🚨 [PlayIntegrity Error] ${err?.message}", err, syncDiskImmediately = true)
                              }
                          })
                      }
                  }
              }

              private fun sanitizeIncogniaDatabase(ctx: Context) {
                  Thread {
                      try {
                          val dbList = ctx.databaseList() ?: emptyArray()
                          for (dbName in dbList) {
                              if (dbName.contains("incognia", ignoreCase = true)) {
                                  val deleted = ctx.deleteDatabase(dbName)
                                  if (deleted) {
                                      captureLog("HOOK", MODULE_TAG, "تم تنظيف قاعدة بيانات $dbName لمنع كراش CursorWindow")
                                  }
                              }
                          }
                      } catch (_: Throwable) {
                      }
                  }.start()
              }

              private fun startAsyncLogWorker() {
                  if (!workerStarted.compareAndSet(false, true)) return
                  val worker = Thread {
                      while (!Thread.currentThread().isInterrupted) {
                          try {
                              val line = asyncLogQueue.poll()
                              if (line != null) {
                                  writeLineToDisk(line, syncImmediately = false)
                                  dispatchBroadcastIntent(line)
                              } else {
                                  Thread.sleep(60L)
                              }
                          } catch (_: Throwable) {
                          }
                      }
                  }
                  worker.isDaemon = true
                  worker.name = "HS_AsyncLogWorker"
                  worker.start()
              }

              private fun startLocalLogServer() {
                  if (!serverStarted.compareAndSet(false, true)) return
                  val serverThread = Thread {
                      try {
                          val serverSocket = ServerSocket(LOCAL_SERVER_PORT, 15, InetAddress.getByName("127.0.0.1"))
                          while (!Thread.currentThread().isInterrupted) {
                              try {
                                  val client = serverSocket.accept()
                                  client.soTimeout = 3000
                                  val reader = BufferedReader(InputStreamReader(client.getInputStream(), Charsets.UTF_8))
                                  val writer = PrintWriter(OutputStreamWriter(client.getOutputStream(), Charsets.UTF_8), true)
                                  val cmd = reader.readLine() ?: "GET"
                                  if (cmd == "CLEAR") {
                                      memoryLogs.clear()
                                      asyncLogQueue.clear()
                                      clearLocalFiles()
                                      writer.println("CLEARED")
                                  } else {
                                      val sentLines = LinkedHashSet<String>()
                                      try {
                                          val diskFile = getPrimaryInternalLogFile()
                                          if (diskFile.exists() && diskFile.canRead()) {
                                              val diskLines = diskFile.readLines()
                                              val tail = if (diskLines.size > 1500) diskLines.takeLast(1500) else diskLines
                                              for (dLine in tail) {
                                                  if (sentLines.add(dLine)) {
                                                      writer.println(dLine)
                                                  }
                                              }
                                          }
                                      } catch (_: Throwable) {
                                      }
                                      for (mLine in memoryLogs) {
                                          if (sentLines.add(mLine)) {
                                              writer.println(mLine)
                                          }
                                      }
                                  }
                                  writer.flush()
                                  client.close()
                              } catch (_: Throwable) {
                              }
                          }
                      } catch (_: Throwable) {
                          serverStarted.set(false)
                      }
                  }
                  serverThread.isDaemon = true
                  serverThread.name = "HS_LSPatch_LogServer"
                  serverThread.start()
              }

              @SuppressLint("BlockedPrivateApi", "SoonBlockedPrivateApi", "DiscouragedPrivateApi")
              private fun sanitizeLocationObject(loc: Location?) {
                  if (loc == null) return
                  try {
                      // تصفير حقل mIsFromMockProviderMask أو mIsFromMockProvider الداخلي عبر XposedHelpers لتجنب حظر Lint
                      runCatching {
                          val mask = XposedHelpers.getStaticIntField(Location::class.java, "mIsFromMockProviderMask")
                          val currentMask = XposedHelpers.getIntField(loc, "mFieldsMask")
                          if ((currentMask and mask) != 0) {
                              XposedHelpers.setIntField(loc, "mFieldsMask", currentMask and mask.inv())
                          }
                      }
                      runCatching {
                          if (XposedHelpers.getBooleanField(loc, "mIsFromMockProvider")) {
                              XposedHelpers.setBooleanField(loc, "mIsFromMockProvider", false)
                          }
                      }
                  } catch (_: Throwable) {
                  }
              }

              private fun setupLocationHooks(lpparam: XC_LoadPackage.LoadPackageParam) {
                  val locationClass = Location::class.java

                  // 1. إخفاء علامات التزييف المباشرة على Location
                  runCatching {
                      XposedHelpers.findAndHookMethod(locationClass, "isMock", object : XC_MethodHook() {
                          override fun beforeHookedMethod(param: MethodHookParam) {
                              sanitizeLocationObject(param.thisObject as? Location)
                          }
                          override fun afterHookedMethod(param: MethodHookParam) {
                              try {
                                  val original = param.result as? Boolean ?: false
                                  param.result = false
                                  if (original) {
                                      captureLog("HOOK", MODULE_TAG, "Location.isMock() تم اعتراضها (الأصل=true -> false)")
                                  }
                              } catch (_: Throwable) {
                              }
                          }
                      })
                  }

                  runCatching {
                      XposedHelpers.findAndHookMethod(locationClass, "isFromMockProvider", object : XC_MethodHook() {
                          override fun beforeHookedMethod(param: MethodHookParam) {
                              sanitizeLocationObject(param.thisObject as? Location)
                          }
                          override fun afterHookedMethod(param: MethodHookParam) {
                              try {
                                  val original = param.result as? Boolean ?: false
                                  param.result = false
                                  if (original) {
                                      captureLog("HOOK", MODULE_TAG, "Location.isFromMockProvider() تم اعتراضها (الأصل=true -> false)")
                                  }
                              } catch (_: Throwable) {
                              }
                          }
                      })
                  }

                  // منع ضبط الموقع كمزيف من الأساس
                  runCatching {
                      XposedHelpers.findAndHookMethod(locationClass, "setIsFromMockProvider", Boolean::class.javaPrimitiveType, object : XC_MethodHook() {
                          override fun beforeHookedMethod(param: MethodHookParam) {
                              param.args[0] = false
                          }
                      })
                  }

                  runCatching {
                      XposedHelpers.findAndHookMethod(locationClass, "setMock", Boolean::class.javaPrimitiveType, object : XC_MethodHook() {
                          override fun beforeHookedMethod(param: MethodHookParam) {
                              param.args[0] = false
                          }
                      })
                  }

                  // تنظيف Location عند الإنشاء أو النسخ
                  runCatching {
                      XposedBridge.hookAllConstructors(locationClass, object : XC_MethodHook() {
                          override fun afterHookedMethod(param: MethodHookParam) {
                              sanitizeLocationObject(param.thisObject as? Location)
                          }
                      })
                      XposedHelpers.findAndHookMethod(locationClass, "set", Location::class.java, object : XC_MethodHook() {
                          override fun afterHookedMethod(param: MethodHookParam) {
                              sanitizeLocationObject(param.thisObject as? Location)
                          }
                      })
                  }

                  // 2. تحسين بيانات الدقة والارتفاع والسرعة
                  runCatching {
                      XposedHelpers.findAndHookMethod(locationClass, "getAccuracy", object : XC_MethodHook() {
                          override fun afterHookedMethod(param: MethodHookParam) {
                              try {
                                  val acc = param.result as? Float ?: 0f
                                  if (acc <= 0.0f || acc > 100.0f || acc == 5.0f) {
                                      param.result = 4.2f
                                  }
                              } catch (_: Throwable) {
                              }
                          }
                      })
                  }

                  runCatching {
                      XposedHelpers.findAndHookMethod(locationClass, "hasAccuracy", object : XC_MethodHook() {
                          override fun afterHookedMethod(param: MethodHookParam) {
                              param.result = true
                          }
                      })
                  }

                  // 3. تنظيف الـ Extras من مفاتيح تطبيقات التزييف
                  runCatching {
                      XposedHelpers.findAndHookMethod(locationClass, "getExtras", object : XC_MethodHook() {
                          override fun afterHookedMethod(param: MethodHookParam) {
                              try {
                                  val extras = param.result as? Bundle ?: return
                                  extras.classLoader = Location::class.java.classLoader
                                  val suspiciousKeys = listOf("mockLocation", "isMock", "mock", "gps_mock", "fromMockProvider")
                                  var modified = false
                                  val copy = Bundle(extras)
                                  for (k in suspiciousKeys) {
                                      if (copy.containsKey(k)) {
                                          copy.remove(k)
                                          modified = true
                                      }
                                  }
                                  if (modified) {
                                      param.result = copy
                                      captureLog("HOOK", MODULE_TAG, "Location.getExtras() تم تنظيف مفاتيح التزييف بنجاح")
