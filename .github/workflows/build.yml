name: Inject Features & Build Android APK (LSPatch Ready)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject LSPatch Support, Crash Fix, Async Log Catcher & UI into Project
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/io/github/khalil212002/unmockgps
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          # 0. التأكد من نظافة ملف xposed_init لتوافق محمل LSPatch
          printf "io.github.khalil212002.unmockgps.UnMockGPS\n" > app/src/main/assets/xposed_init

          # 1. تحديث app/build.gradle.kts مع compileSdk 36 وتوقيع Release تلقائياً
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              alias(libs.plugins.android.application)
          }

          android {
              namespace = "io.github.khalil212002.unmockgps"
              compileSdk {
                  version = release(36) {
                      minorApiLevel = 1
                  }
              }

              defaultConfig {
                  applicationId = "io.github.khalil212002.unmockgps"
                  minSdk = 28
                  targetSdk = 33
                  versionCode = 3
                  versionName = "1.2-lspatch-stable"

                  testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
              }

              buildTypes {
                  debug {
                      isMinifyEnabled = false
                  }
                  release {
                      signingConfig = signingConfigs.getByName("debug")
                      isMinifyEnabled = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_11
                  targetCompatibility = JavaVersion.VERSION_11
              }

              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
                  dex {
                      useLegacyPackaging = true
                  }
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
          }

          dependencies {
              implementation(libs.androidx.core.ktx)
              implementation(libs.androidx.appcompat)
              implementation(libs.material)
              testImplementation(libs.junit)
              androidTestImplementation(libs.androidx.junit)
              androidTestImplementation(libs.androidx.espresso.core)
              compileOnly(libs.xposed.api)
          }
          EOF

          # 2. كتابة كود الموديول UnMockGPS.kt (معالجة الكراش + طابور غير متزامن + حفظ الكراش على القرص قبل موت العملية)
          cat << 'EOF' > app/src/main/java/io/github/khalil212002/unmockgps/UnMockGPS.kt
          package io.github.khalil212002.unmockgps

          import android.app.AndroidAppHelper
          import android.app.Application
          import android.content.Context
          import android.content.ContextWrapper
          import android.content.Intent
          import android.location.Location
          import android.os.Bundle
          import android.os.Process
          import android.util.Log
          import de.robv.android.xposed.IXposedHookLoadPackage
          import de.robv.android.xposed.IXposedHookZygoteInit
          import de.robv.android.xposed.XC_MethodHook
          import de.robv.android.xposed.XposedBridge
          import de.robv.android.xposed.XposedHelpers
          import de.robv.android.xposed.callbacks.XC_LoadPackage
          import java.io.BufferedReader
          import java.io.File
          import java.io.FileOutputStream
          import java.io.InputStreamReader
          import java.io.OutputStreamWriter
          import java.io.PrintWriter
          import java.io.StringWriter
          import java.net.InetAddress
          import java.net.ServerSocket
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.concurrent.ConcurrentLinkedQueue
          import java.util.concurrent.CopyOnWriteArrayList
          import java.util.concurrent.atomic.AtomicBoolean
          import java.util.concurrent.atomic.AtomicInteger

          class UnMockGPS : IXposedHookLoadPackage, IXposedHookZygoteInit {

              companion object {
                  const val TARGET_PACKAGE = "com.logistics.rider.hungerstation"
                  const val MODULE_PACKAGE = "io.github.khalil212002.unmockgps"
                  const val MODULE_TAG = "HS_UnmockGPS"
                  const val LOG_FILE_NAME = "hs_caught_logs.log"
                  const val ACTION_LOG_ENTRY = "io.github.khalil212002.unmockgps.ACTION_LOG_ENTRY"
                  const val EXTRA_LOG_LINE = "extra_log_line"
                  const val LOCAL_SERVER_PORT = 45821
                  private const val MAX_MEMORY_LOGS = 2000
              }

              private val isCapturing = ThreadLocal.withInitial { false }
              private val memoryLogs = CopyOnWriteArrayList<String>()
              private val asyncLogQueue = ConcurrentLinkedQueue<String>()
              private val serverStarted = AtomicBoolean(false)
              private val workerStarted = AtomicBoolean(false)
              private val hooksInstalled = AtomicBoolean(false)
              private val previousLogsLoaded = AtomicBoolean(false)
              private val firebaseWarnCounter = AtomicInteger(0)
              @Volatile
              private var appContext: Context? = null

              override fun initZygote(startupParam: IXposedHookZygoteInit.StartupParam?) {
              }

              override fun handleLoadPackage(lpparam: XC_LoadPackage.LoadPackageParam) {
                  if (lpparam.packageName == MODULE_PACKAGE) return
                  if (lpparam.packageName != TARGET_PACKAGE && !lpparam.packageName.contains("hungerstation", ignoreCase = true)) {
                      return
                  }

                  if (!hooksInstalled.compareAndSet(false, true)) return

                  // 1. تحميل سجلات الجلسة السابقة (للحفاظ على أي Crash حدث قبل إعادة تشغيل التطبيق)
                  loadPreviousSessionLogs()

                  // 2. تشغيل خيط الكتابة الخلفي لمنع تجميد الواجهة (Skipped frames / ANR)
                  startAsyncLogWorker()

                  // 3. تشغيل الخادم المحلي لنقل السجلات لواجهة التطبيق
                  startLocalLogServer()

                  // 4. التقاط Context التطبيق وتنظيف قاعدة بيانات incognia_errors المسببة للكراش
                  hookApplicationContext()

                  captureLog("INFO", MODULE_TAG, "=== بدء جلسة جديدة داخل: ${lpparam.packageName} (PID=${Process.myPid()}) ===")

                  // 5. تفعيل صائد السجلات والكراشات (بما في ذلك AndroidRuntime و Sentry/Crashlytics)
                  setupLogAndCrashCatcher()

                  // 6. تفعيل خطافات الموقع الآمنة (Mock Location Bypass)
                  setupLocationHooks()
              }

              private fun formatNow(): String {
                  return SimpleDateFormat("yyyy-MM-dd HH:mm:ss.SSS", Locale.US).format(Date())
              }

              private fun getPrimaryInternalLogFile(): File {
                  val ctx = resolveContext()
                  if (ctx != null) {
                      return File(ctx.filesDir, LOG_FILE_NAME)
                  }
                  return File("/data/user/0/$TARGET_PACKAGE/files/$LOG_FILE_NAME")
              }

              private fun loadPreviousSessionLogs() {
                  if (!previousLogsLoaded.compareAndSet(false, true)) return
                  try {
                      val file = getPrimaryInternalLogFile()
                      if (file.exists() && file.canRead() && file.length() > 0) {
                          val lines = file.readLines()
                          val tail = if (lines.size > 600) lines.takeLast(600) else lines
                          memoryLogs.addAll(tail)
                      }
                  } catch (_: Throwable) {
                  }
              }

              private fun hookApplicationContext() {
                  runCatching {
                      XposedHelpers.findAndHookMethod(
                          ContextWrapper::class.java,
                          "attachBaseContext",
                          Context::class.java,
                          object : XC_MethodHook() {
                              override fun afterHookedMethod(param: MethodHookParam) {
                                  try {
                                      val ctx = param.args[0] as? Context ?: return
                                      if (appContext == null) {
                                          appContext = ctx.applicationContext ?: ctx
                                          loadPreviousSessionLogs()
                                          sanitizeIncogniaDatabase(appContext!!)
                                      }
                                  } catch (_: Throwable) {
                                  }
                              }
                          }
                      )
                  }

                  runCatching {
                      XposedHelpers.findAndHookMethod(
                          Application::class.java,
                          "onCreate",
                          object : XC_MethodHook() {
                              override fun afterHookedMethod(param: MethodHookParam) {
                                  try {
                                      val app = param.thisObject as? Application ?: return
                                      appContext = app.applicationContext ?: app
                                      loadPreviousSessionLogs()
                                      sanitizeIncogniaDatabase(appContext!!)
                                  } catch (_: Throwable) {
                                  }
                              }
                          }
                      )
                  }
              }

              // إصلاح كراش SQLiteBlobTooBigException: Row too big to fit into CursorWindow (SELECT * FROM incognia_errors)
              private fun sanitizeIncogniaDatabase(ctx: Context) {
                  Thread {
                      try {
                          val dbList = ctx.databaseList() ?: emptyArray()
                          for (dbName in dbList) {
                              if (dbName.contains("incognia", ignoreCase = true)) {
                                  val deleted = ctx.deleteDatabase(dbName)
                                  if (deleted) {
                                      captureLog("HOOK", MODULE_TAG, "تم تنظيف قاعدة بيانات $dbName لمنع كراش CursorWindow")
                                  }
                              }
                          }
                      } catch (_: Throwable) {
                      }
                  }.start()
              }

              private fun startAsyncLogWorker() {
                  if (!workerStarted.compareAndSet(false, true)) return
                  val worker = Thread {
                      while (!Thread.currentThread().isInterrupted) {
                          try {
                              val line = asyncLogQueue.poll()
                              if (line != null) {
                                  writeLineToDisk(line, syncImmediately = false)
                                  dispatchBroadcastIntent(line)
                              } else {
                                  Thread.sleep(60L)
                              }
                          } catch (_: Throwable) {
                          }
                      }
                  }
                  worker.isDaemon = true
                  worker.name = "HS_AsyncLogWorker"
                  worker.start()
              }

              private fun startLocalLogServer() {
                  if (!serverStarted.compareAndSet(false, true)) return
                  val serverThread = Thread {
                      try {
                          val serverSocket = ServerSocket(LOCAL_SERVER_PORT, 15, InetAddress.getByName("127.0.0.1"))
                          while (!Thread.currentThread().isInterrupted) {
                              try {
                                  val client = serverSocket.accept()
                                  client.soTimeout = 3000
                                  val reader = BufferedReader(InputStreamReader(client.getInputStream(), Charsets.UTF_8))
                                  val writer = PrintWriter(OutputStreamWriter(client.getOutputStream(), Charsets.UTF_8), true)
                                  val cmd = reader.readLine() ?: "GET"
                                  if (cmd == "CLEAR") {
                                      memoryLogs.clear()
                                      asyncLogQueue.clear()
                                      clearLocalFiles()
                                      writer.println("CLEARED")
                                  } else {
                                      // إرسال السجلات المحفوظة على القرص أولاً ثم الذاكرة لضمان عدم ضياع أي كراش سابق
                                      val sentLines = LinkedHashSet<String>()
                                      try {
                                          val diskFile = getPrimaryInternalLogFile()
                                          if (diskFile.exists() && diskFile.canRead()) {
                                              val diskLines = diskFile.readLines()
                                              val tail = if (diskLines.size > 1500) diskLines.takeLast(1500) else diskLines
                                              for (dLine in tail) {
                                                  if (sentLines.add(dLine)) {
                                                      writer.println(dLine)
                                                  }
                                              }
                                          }
                                      } catch (_: Throwable) {
                                      }
                                      for (mLine in memoryLogs) {
                                          if (sentLines.add(mLine)) {
                                              writer.println(mLine)
                                          }
                                      }
                                  }
                                  writer.flush()
                                  client.close()
                              } catch (_: Throwable) {
                              }
                          }
                      } catch (_: Throwable) {
                          serverStarted.set(false)
                      }
                  }
                  serverThread.isDaemon = true
                  serverThread.name = "HS_LSPatch_LogServer"
                  serverThread.start()
              }

              private fun setupLocationHooks() {
                  val locationClass = Location::class.java

                  // إخفاء علامة الموقع الوهمي isMock بأمان تام
                  runCatching {
                      XposedHelpers.findAndHookMethod(locationClass, "isMock", object : XC_MethodHook() {
                          override fun afterHookedMethod(param: MethodHookParam) {
                              try {
                                  val original = param.result as? Boolean ?: false
                                  param.result = false
                                  if (original) {
                                      captureLog("HOOK", MODULE_TAG, "Location.isMock() تم اعتراضها (الأصل=true -> false)")
                                  }
                              } catch (_: Throwable) {
                              }
                          }
                      })
                  }

                  // إخفاء علامة المزود الوهمي isFromMockProvider بأمان تام
                  runCatching {
                      XposedHelpers.findAndHookMethod(locationClass, "isFromMockProvider", object : XC_MethodHook() {
                          override fun afterHookedMethod(param: MethodHookParam) {
                              try {
                                  val original = param.result as? Boolean ?: false
                                  param.result = false
                                  if (original) {
                                      captureLog("HOOK", MODULE_TAG, "Location.isFromMockProvider() تم اعتراضها (الأصل=true -> false)")
                                  }
                              } catch (_: Throwable) {
                              }
                          }
                      })
                  }

                  // تعديل الدقة فقط إذا كانت 0 أو غير موجودة لتفادي كشف القيمة الثابتة
                  runCatching {
                      XposedHelpers.findAndHookMethod(locationClass, "getAccuracy", object : XC_MethodHook() {
                          override fun afterHookedMethod(param: MethodHookParam) {
                              try {
                                  val acc = param.result as? Float ?: 0f
                                  if (acc <= 0.0f || acc > 100.0f) {
                                      param.result = 4.5f
                                  }
                              } catch (_: Throwable) {
                              }
                          }
                      })
                  }

                  runCatching {
                      XposedHelpers.findAndHookMethod(locationClass, "hasAccuracy", object : XC_MethodHook() {
                          override fun afterHookedMethod(param: MethodHookParam) {
                              try {
                                  param.result = true
                              } catch (_: Throwable) {
                              }
                          }
                      })
                  }

                  // ملاحظة هامة: تجنب استدعاء containsKey المباشر بدون حماية على getExtras لأنه يرمي BadParcelableException ويسبب كراش
                  runCatching {
                      XposedHelpers.findAndHookMethod(locationClass, "getExtras", object : XC_MethodHook() {
                          override fun afterHookedMethod(param: MethodHookParam) {
                              try {
                                  val extras = param.result as? Bundle ?: return
                                  extras.classLoader = Location::class.java.classLoader
                                  if (extras.containsKey("mockLocation")) {
                                      val copy = Bundle(extras)
                                      copy.remove("mockLocation")
                                      param.result = copy
                                      captureLog("HOOK", MODULE_TAG, "Location.getExtras() تم حذف مفتاح mockLocation بأمان")
                                  }
                              } catch (_: Throwable) {
                                  // تجاهل BadParcelableException حتى لا ينهار التطبيق المستهدف أبداً
                              }
                          }
                      })
                  }

                  captureLog("INFO", MODULE_TAG, "تم تفعيل كافة خطافات الموقع (Location Hooks) بنجاح")
              }

              private fun isIgnoredOrSpam(tag: String, msg: String): Boolean {
                  if (tag == MODULE_TAG ||
                      tag.contains("LSPosed", ignoreCase = true) ||
                      tag.contains("LSPatch", ignoreCase = true) ||
                      tag.contains("Xposed", ignoreCase = true)
                  ) {
                      return true
                  }
                  if (msg.contains(MODULE_TAG)) {
                      return true
                  }
                  // منع طوفان تحذيرات FirebaseRemoteConfig من إغراق السجل وتبطيء التطبيق
                  if (tag == "FirebaseRemoteConfig" && msg.contains("An entry in the defaults XML has an invalid key")) {
                      val count = firebaseWarnCounter.incrementAndGet()
                      if (count > 2) return true
                  }
                  return false
              }

              private fun setupLogAndCrashCatcher() {
                  try {
                      val logClass = Log::class.java
                      val logLevels = mapOf(
                          "v" to "VERBOSE",
                          "d" to "DEBUG",
                          "i" to "INFO",
                          "w" to "WARN",
                          "e" to "ERROR",
                          "wtf" to "WTF"
                      )

                      for ((methodName, levelName) in logLevels) {
                          runCatching {
                              XposedHelpers.findAndHookMethod(
                                  logClass,
                                  methodName,
                                  String::class.java,
                                  String::class.java,
                                  object : XC_MethodHook() {
                                      override fun beforeHookedMethod(param: MethodHookParam) {
                                          try {
                                              if (isCapturing.get() == true) return
                                              val tag = param.args[0] as? String ?: "NULL_TAG"
                                              val msg = param.args[1] as? String ?: ""
                                              if (!isIgnoredOrSpam(tag, msg)) {
                                                  val isFatal = tag == "AndroidRuntime" || levelName == "ERROR" || levelName == "WTF"
                                                  captureLog(if (tag == "AndroidRuntime") "CRASH" else levelName, tag, msg, null, isFatal)
                                              }
                                          } catch (_: Throwable) {
                                          }
                                      }
                                  }
                              )
                          }

                          runCatching {
                              XposedHelpers.findAndHookMethod(
                                  logClass,
                                  methodName,
                                  String::class.java,
                                  String::class.java,
                                  Throwable::class.java,
                                  object : XC_MethodHook() {
                                      override fun beforeHookedMethod(param: MethodHookParam) {
                                          try {
                                              if (isCapturing.get() == true) return
                                              val tag = param.args[0] as? String ?: "NULL_TAG"
                                              val msg = param.args[1] as? String ?: ""
                                              val tr = param.args[2] as? Throwable
                                              if (!isIgnoredOrSpam(tag, msg)) {
                                                  val isFatal = tag == "AndroidRuntime" || levelName == "ERROR" || levelName == "WTF"
                                                  captureLog(if (tag == "AndroidRuntime") "CRASH" else levelName, tag, msg, tr, isFatal)
                                              }
                                          } catch (_: Throwable) {
                                          }
                                      }
                                  }
                              )
                          }
                      }

                      // 1. تثبيت معالج استثناءات شامل يلتقط أي Crash قبل Sentry/Crashlytics ويحفظه فوراً على القرص
                      runCatching {
                          val previousHandler = Thread.getDefaultUncaughtExceptionHandler()
                          Thread.setDefaultUncaughtExceptionHandler { thread, throwable ->
                              try {
                                  captureLog(
                                      "CRASH",
                                      "UncaughtException",
                                      "💥 انهيار التطبيق في الخيط (${thread.name}): ${throwable.javaClass.name}: ${throwable.message}",
                                      throwable,
                                      syncDiskImmediately = true
                                  )
                              } catch (_: Throwable) {
                              }
                              previousHandler?.uncaughtException(thread, throwable)
                          }
                      }

                      // 2. اعتراض استبدال DefaultUncaughtExceptionHandler من قبل Sentry أو Crashlytics ليبقى معالجنا نشطاً دائماً
                      runCatching {
                          XposedHelpers.findAndHookMethod(
                              Thread::class.java,
                              "setDefaultUncaughtExceptionHandler",
                              Thread.UncaughtExceptionHandler::class.java,
                              object : XC_MethodHook() {
                                  override fun beforeHookedMethod(param: MethodHookParam) {
                                      try {
                                          val originalHandler = param.args[0] as? Thread.UncaughtExceptionHandler ?: return
                                          param.args[0] = Thread.UncaughtExceptionHandler { thread, throwable ->
                                              try {
                                                  captureLog(
                                                      "CRASH",
                                                      "UncaughtException",
                                                      "💥 انهيار التطبيق في الخيط (${thread.name}): ${throwable.javaClass.name}: ${throwable.message}",
                                                      throwable,
                                                      syncDiskImmediately = true
                                                  )
                                              } catch (_: Throwable) {
                                              }
                                              originalHandler.uncaughtException(thread, throwable)
                                          }
                                      } catch (_: Throwable) {
                                      }
                                  }
                              }
                          )
                      }

                      // 3. اعتراض Process.killProcess و System.exit لتسجيل سبب إغلاق التطبيق وحفظ السجل قبل موت العملية
                      runCatching {
                          XposedHelpers.findAndHookMethod(
                              Process::class.java,
                              "killProcess",
                              Int::class.javaPrimitiveType,
                              object : XC_MethodHook() {
                                  override fun beforeHookedMethod(param: MethodHookParam) {
                                      try {
                                          val pid = param.args[0] as? Int ?: 0
                                          if (pid == Process.myPid()) {
                                              captureLog(
                                                  "CRASH",
                                                  "ProcessKill",
                                                  "⚠️ تم استدعاء Process.killProcess($pid) لإنهاء التطبيق",
                                                  RuntimeException("StackTrace for killProcess"),
                                                  syncDiskImmediately = true
                                              )
                                          }
                                      } catch (_: Throwable) {
                                      }
                                  }
                              }
                          )
                      }

                      runCatching {
                          XposedHelpers.findAndHookMethod(
                              System::class.java,
                              "exit",
                              Int::class.javaPrimitiveType,
                              object : XC_MethodHook() {
                                  override fun beforeHookedMethod(param: MethodHookParam) {
                                      try {
                                          val status = param.args[0] as? Int ?: 0
                                          captureLog(
                                              "CRASH",
                                              "SystemExit",
                                              "⚠️ تم استدعاء System.exit($status) لإنهاء التطبيق",
                                              RuntimeException("StackTrace for System.exit"),
                                              syncDiskImmediately = true
                                          )
                                      } catch (_: Throwable) {
                                      }
                                  }
                              }
                          )
                      }

                      captureLog("INFO", MODULE_TAG, "تم تفعيل صائد السجلات والكراشات (Log & Crash Catcher) بنجاح")
                  } catch (e: Throwable) {
                      XposedBridge.log("$MODULE_TAG: Failed to setup log catcher: ${e.message}")
                  }
              }

              private fun captureLog(
                  level: String,
                  tag: String,
                  message: String,
                  throwable: Throwable? = null,
                  syncDiskImmediately: Boolean = false
              ) {
                  if (isCapturing.get() == true) return
                  isCapturing.set(true)
                  try {
                      val timestamp = formatNow()
                      val FullLines = ArrayList<String>()
                      val firstLine = "[$timestamp] [$level/$tag]: $message"
                      FullLines.add(firstLine)

                      if (throwable != null) {
                          val sw = StringWriter()
                          throwable.printStackTrace(PrintWriter(sw))
                          val stackLines = sw.toString().trimEnd().lines()
                          for (sLine in stackLines) {
                              FullLines.add("[$timestamp] [$level/$tag]:   $sLine")
                          }
                      }

                      for (line in FullLines) {
                          if (memoryLogs.size >= MAX_MEMORY_LOGS) {
                              memoryLogs.removeAt(0)
                          }
                          memoryLogs.add(line)

                          if (syncDiskImmediately) {
                              // كتابة متزامنة فورية على القرص مع fd.sync() عند حدوث كراش لضمان عدم ضياع السطر قبل موت العملية
                              writeLineToDisk(line, syncImmediately = true)
                              dispatchBroadcastIntent(line)
                          } else {
                              asyncLogQueue.offer(line)
                          }
                      }
                  } catch (_: Throwable) {
                  } finally {
                      isCapturing.set(false)
                  }
              }

              private fun resolveContext(): Context? {
                  appContext?.let { return it }
                  runCatching {
                      val current = AndroidAppHelper.currentApplication()
                      if (current != null) {
                          appContext = current
                      }
                  }
                  return appContext
              }

              private fun dispatchBroadcastIntent(logLine: String) {
                  val ctx = resolveContext() ?: return
                  try {
                      val intent = Intent(ACTION_LOG_ENTRY).apply {
                          setPackage(MODULE_PACKAGE)
                          putExtra(EXTRA_LOG_LINE, logLine)
                          addFlags(Intent.FLAG_INCLUDE_STOPPED_PACKAGES)
                      }
                      ctx.sendBroadcast(intent)
                  } catch (_: Throwable) {
                  }
              }

              @Synchronized
              private fun writeLineToDisk(logLine: String, syncImmediately: Boolean) {
                  try {
                      val file = getPrimaryInternalLogFile()
                      file.parentFile?.let { if (!it.exists()) it.mkdirs() }
                      FileOutputStream(file, true).use { fos ->
                          fos.write((logLine + "\n").toByteArray(Charsets.UTF_8))
                          fos.flush()
                          if (syncImmediately) {
                              fos.fd.sync()
                          }
                      }
                  } catch (_: Throwable) {
                  }
              }

              @Synchronized
              private fun clearLocalFiles() {
                  try {
                      val file = getPrimaryInternalLogFile()
                      if (file.exists() && file.canWrite()) {
                          file.writeText("")
                      }
                  } catch (_: Throwable) {
                  }
              }
          }
          EOF

          # 3. كتابة مستقبل البث الثابت LogReceiver.kt (يعمل في خيط خلفي لعدم تجميد الواجهة)
          cat << 'EOF' > app/src/main/java/io/github/khalil212002/unmockgps/LogReceiver.kt
          package io.github.khalil212002.unmockgps

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import java.io.File
          import java.util.concurrent.Executors

          class LogReceiver : BroadcastReceiver() {
              companion object {
                  private val ioExecutor = Executors.newSingleThreadExecutor()
              }

              override fun onReceive(context: Context?, intent: Intent?) {
                  if (context == null || intent?.action != UnMockGPS.ACTION_LOG_ENTRY) return
                  val line = intent.getStringExtra(UnMockGPS.EXTRA_LOG_LINE) ?: return
                  val appCtx = context.applicationContext ?: context
                  ioExecutor.execute {
                      try {
                          val internalLog = File(appCtx.filesDir, UnMockGPS.LOG_FILE_NAME)
                          internalLog.appendText("$line\n")
                      } catch (_: Throwable) {
                      }
                  }
              }
          }
          EOF

          # 4. كتابة واجهة المستخدم MainActivity.kt (مع زر فلترة الأخطاء والكراشات + حماية الأداء)
          cat << 'EOF' > app/src/main/java/io/github/khalil212002/unmockgps/MainActivity.kt
          package io.github.khalil212002.unmockgps

          import android.content.BroadcastReceiver
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.View
          import android.widget.Button
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import java.io.BufferedReader
          import java.io.File
          import java.io.InputStreamReader
          import java.io.OutputStreamWriter
          import java.io.PrintWriter
          import java.net.InetSocketAddress
          import java.net.Socket

          class MainActivity : AppCompatActivity() {

              private lateinit var tvStatus: TextView
              private lateinit var tvLogContent: TextView
              private lateinit var scrollViewLogs: ScrollView
              private lateinit var btnCopyLog: Button
              private lateinit var btnFilterCrash: Button
              private lateinit var btnRefreshLog: Button
              private lateinit var btnClearLog: Button

              private val allLogLines = ArrayList<String>()
              private val seenSet = HashSet<String>()
              private val uiHandler = Handler(Looper.getMainLooper())
              private var filterImportantOnly = false
              private var renderPending = false

              private val autoRefreshRunnable = object : Runnable {
                  override fun run() {
                      fetchAllLogsAsync(showToast = false)
                      uiHandler.postDelayed(this, 2500L)
                  }
              }

              private val liveLogReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      if (intent?.action == UnMockGPS.ACTION_LOG_ENTRY) {
                          val line = intent.getStringExtra(UnMockGPS.EXTRA_LOG_LINE) ?: return
                          synchronized(allLogLines) {
                              if (seenSet.add(line)) {
                                  allLogLines.add(line)
                                  scheduleRender()
                              }
                          }
                      }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  tvStatus = findViewById(R.id.tvStatus)
                  tvLogContent = findViewById(R.id.tvLogContent)
                  scrollViewLogs = findViewById(R.id.scrollViewLogs)
                  btnCopyLog = findViewById(R.id.btnCopyLog)
                  btnFilterCrash = findViewById(R.id.btnFilterCrash)
                  btnRefreshLog = findViewById(R.id.btnRefreshLog)
                  btnClearLog = findViewById(R.id.btnClearLog)

                  tvStatus.text = "الحزمة المستهدفة: ${UnMockGPS.TARGET_PACKAGE} (LSPatch Ready)"

                  btnCopyLog.setOnClickListener {
                      val currentLogs = tvLogContent.text.toString()
                      if (currentLogs.isBlank() || currentLogs == getString(R.string.no_logs_yet)) {
                          Toast.makeText(this, "لا يوجد سجل لنسخه حالياً", Toast.LENGTH_SHORT).show()
                          return@setOnClickListener
                      }
                      val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      val clip = ClipData.newPlainText("HS_Caught_Logs", currentLogs)
                      clipboard.setPrimaryClip(clip)
                      Toast.makeText(this, "تم نسخ السجل إلى الحافظة بنجاح!", Toast.LENGTH_SHORT).show()
                  }

                  btnFilterCrash.setOnClickListener {
                      filterImportantOnly = !filterImportantOnly
                      btnFilterCrash.text = if (filterImportantOnly) "عرض: الكل" else "الأخطاء فقط"
                      renderLogsNow()
                  }

                  btnRefreshLog.setOnClickListener {
                      fetchAllLogsAsync(showToast = true)
                  }

                  btnClearLog.setOnClickListener {
                      clearLogs()
                  }

                  registerLiveReceiver()
                  fetchAllLogsAsync(showToast = false)
              }

              override fun onResume() {
                  super.onResume()
                  uiHandler.removeCallbacks(autoRefreshRunnable)
                  uiHandler.post(autoRefreshRunnable)
              }

              override fun onPause() {
                  super.onPause()
                  uiHandler.removeCallbacks(autoRefreshRunnable)
              }

              private fun registerLiveReceiver() {
                  val filter = IntentFilter(UnMockGPS.ACTION_LOG_ENTRY)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(liveLogReceiver, filter, Context.RECEIVER_EXPORTED)
                  } else {
                      registerReceiver(liveLogReceiver, filter)
                  }
              }

              private fun scheduleRender() {
                  if (renderPending) return
                  renderPending = true
                  uiHandler.postDelayed({
                      renderPending = false
                      renderLogsNow()
                  }, 250L)
              }

              private fun isImportantLine(line: String): Boolean {
                  return line.contains("[CRASH/") ||
                      line.contains("[ERROR/") ||
                      line.contains("[WTF/") ||
                      line.contains("[HOOK/") ||
                      line.contains("HS_UnmockGPS") ||
                      line.contains("Exception") ||
                      line.contains("Error")
              }

              private fun renderLogsNow() {
                  val snapshot: List<String>
                  synchronized(allLogLines) {
                      snapshot = if (filterImportantOnly) {
                          allLogLines.filter { isImportantLine(it) }
                      } else {
                          ArrayList(allLogLines)
                      }
                  }

                  if (snapshot.isEmpty()) {
                      tvLogContent.text = if (filterImportantOnly) {
                          "لا توجد سجلات أخطاء (CRASH / ERROR) أو Hooks حتى الآن."
                      } else {
                          getString(R.string.no_logs_yet)
                      }
                      return
                  }

                  val displayList = if (snapshot.size > 800) snapshot.takeLast(800) else snapshot
                  tvLogContent.text = displayList.joinToString("\n")
                  scrollViewLogs.post {
                      scrollViewLogs.fullScroll(View.FOCUS_DOWN)
                  }
              }

              private fun fetchAllLogsAsync(showToast: Boolean) {
                  Thread {
                      val collected = ArrayList<String>()

                      // 1. السحب المباشر عبر Localhost Socket من التطبيق المعدل بـ LSPatch
                      try {
                          Socket().use { socket ->
                              socket.connect(InetSocketAddress("127.0.0.1", UnMockGPS.LOCAL_SERVER_PORT), 800)
                              socket.soTimeout = 1500
                              val writer = PrintWriter(OutputStreamWriter(socket.getOutputStream(), Charsets.UTF_8), true)
                              val reader = BufferedReader(InputStreamReader(socket.getInputStream(), Charsets.UTF_8))
                              writer.println("GET")
                              var line: String?
                              while (reader.readLine().also { line = it } != null) {
                                  if (!line.isNullOrBlank()) {
                                      collected.add(line!!)
                                  }
                              }
                          }
                      } catch (_: Throwable) {
                      }

                      // 2. قراءة السجلات المستلمة عبر BroadcastReceiver والمحفوظة داخلياً
                      try {
                          val internalFile = File(filesDir, UnMockGPS.LOG_FILE_NAME)
                          if (internalFile.exists() && internalFile.canRead() && internalFile.length() > 0) {
                              internalFile.forEachLine { line ->
                                  if (line.isNotBlank()) {
                                      collected.add(line)
                                  }
                              }
                          }
                      } catch (_: Throwable) {
                      }

                      uiHandler.post {
                          var changed = false
                          synchronized(allLogLines) {
                              for (item in collected) {
                                  if (seenSet.add(item)) {
                                      allLogLines.add(item)
                                      changed = true
                                  }
                              }
                          }
                          if (changed || allLogLines.isEmpty()) {
                              renderLogsNow()
                          }
                          if (showToast) {
                              Toast.makeText(this, "تم تحديث السجل", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }.start()
              }

              private fun clearLogs() {
                  synchronized(allLogLines) {
                      allLogLines.clear()
                      seenSet.clear()
                  }
                  tvLogContent.text = getString(R.string.no_logs_yet)

                  Thread {
                      try {
                          Socket().use { socket ->
                              socket.connect(InetSocketAddress("127.0.0.1", UnMockGPS.LOCAL_SERVER_PORT), 800)
                              val writer = PrintWriter(OutputStreamWriter(socket.getOutputStream(), Charsets.UTF_8), true)
                              writer.println("CLEAR")
                          }
                      } catch (_: Throwable) {
                      }

                      try {
                          val internalFile = File(filesDir, UnMockGPS.LOG_FILE_NAME)
                          if (internalFile.exists() && internalFile.canWrite()) {
                              internalFile.writeText("")
                          }
                      } catch (_: Throwable) {
                      }
                  }.start()

                  Toast.makeText(this, "تم مسح السجل", Toast.LENGTH_SHORT).show()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  uiHandler.removeCallbacks(autoRefreshRunnable)
                  try {
                      unregisterReceiver(liveLogReceiver)
                  } catch (_: Throwable) {
                  }
              }
          }
          EOF

          # 5. كتابة ملف تخطيط الواجهة activity_main.xml (مع زر فلترة الأخطاء)
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
